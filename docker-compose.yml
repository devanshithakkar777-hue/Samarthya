services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: samarthya, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set in .env}", POSTGRES_DB: samarthya }
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U samarthya"], interval: 5s, timeout: 3s, retries: 10 }
    restart: unless-stopped
  api:
    build: ./apps/api
    environment:
      ENV: prod
      DATABASE_URL: "postgresql+psycopg://samarthya:${POSTGRES_PASSWORD}@db:5432/samarthya"
      JWT_SECRET: "${JWT_SECRET:?set in .env}"
      JOURNAL_KEY: "${JOURNAL_KEY:?set in .env}"
      CORS_ORIGINS: "${CORS_ORIGINS}"
      SMTP_HOST: "${SMTP_HOST:?set in .env}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped
  web:
    build: ./apps/web
    environment: { API_URL: "http://api:8000", SITE_URL: "${SITE_URL}" }
    depends_on: [api]
    ports: ["3000:3000"]
    restart: unless-stopped
volumes:
  dbdata:
